name: Deploy Project to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BIZNET_VPS_AUTO_DEPLOY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            cd ${{ secrets.VPS_PATH }}

            # Agar tidak nyangkut di maintenance mode jika terjadi error
            trap 'echo "🔺 Disable maintenance mode (trap safety net)"; php artisan up || true' EXIT

            echo "🔻 Enable maintenance mode"
            php artisan down || true

            echo "📥 Pull latest code..."
            git reset --hard
            git pull origin main

            echo "📦 Install PHP dependencies"
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "📦 Install & build frontend"
            npm install
            npm run build

            echo "🗄️ Run migrations"
            # Menjalankan SEMUA migration yang tertunda
            php artisan migrate --force

            # echo "⚠️ Run Seeders"
            # php artisan db:seed --force || true

            echo "🧹 Rebuild cache & Optimization"
            php artisan optimize:clear
            php artisan optimize
            php artisan view:cache
            php artisan event:cache

            echo "🔗 Ensure storage link exists"
            php artisan storage:link || true

            echo "🔐 Fix permissions"
            sudo chown -R www-data:www-data .
            sudo chmod -R 775 storage bootstrap/cache public/storage

            echo "🔁 Restart services"
            PHP_FPM_SERVICE="php$(php -r 'echo PHP_MAJOR_VERSION.\".\".PHP_MINOR_VERSION;')-fpm"
            sudo systemctl restart "$PHP_FPM_SERVICE" || sudo systemctl restart php8.5-fpm
            sudo nginx -t && sudo systemctl reload nginx

            echo "📦 Cek status WhatsApp Gateway..."
            if ! sudo pm2 describe wa-gateway >/dev/null 2>&1; then
              echo "🚀 WhatsApp Gateway belum terdaftar di PM2, menjalankan service..."
              cd whatsapp-gateway
              sudo pm2 start server.cjs --name "wa-gateway"
              sudo pm2 save
              cd ..
            elif [ -z "$(sudo pm2 pid wa-gateway 2>/dev/null)" ] || ! curl -s -m 3 http://127.0.0.1:3000/health | grep -q '"status":"healthy"'; then
              echo "⚠️ WhatsApp Gateway tidak aktif atau berstatus error/unhealthy, me-restart..."
              sudo pm2 restart wa-gateway
            else
              echo "✅ WhatsApp Gateway sudah berjalan normal & terhubung (healthy), restart dilewati."
            fi

            # WA dikirim via queue — cek worker, jalankan atau restart
            echo "🔄 Cek Queue Worker..."
            if [ -z "$(sudo pm2 pid laravel-worker 2>/dev/null)" ]; then
              echo "🚀 Queue Worker tidak berjalan, menjalankan..."
              sudo pm2 start "php artisan queue:work --tries=3 --timeout=120" --name "laravel-worker"
            else
              echo "✅ Queue Worker sudah berjalan, me-restart worker..."
              sudo pm2 restart laravel-worker || true
            fi

            echo "🔺 Disable maintenance mode"
            php artisan up

            echo "🏥 Running Health Check..."
            sleep 2
            STATUS=$(curl -Lo /dev/null -s -w "%{http_code}" -H "Host: serrata.xyz" http://127.0.0.1)

            if [[ "$STATUS" =~ ^(200|301|302)$ ]]; then
              echo "✅ Deploy finished successfully (HTTP $STATUS)"
            else
              echo "❌ Health Check FAILED with status: $STATUS"
              echo "Showing last 20 lines of Nginx error log:"
              sudo tail -n 20 /var/log/nginx/error.log
              echo "Showing last 30 lines of Laravel log:"
              sudo tail -n 30 storage/logs/laravel.log
              exit 1
            fi
          EOF
